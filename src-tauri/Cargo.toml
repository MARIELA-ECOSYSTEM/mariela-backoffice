[package]
name = "mariela-backoffice"
version = "0.1.6"
description = "MARIELA Backoffice desktop shell"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mariela_backoffice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Fase 22.8.8.7 (M7) — o `build.rs` recalcula a configuração efetiva do Tauri (travas de ambiente). Mesma crate e
# versão já presentes no Cargo.lock (dependência do próprio Tauri e deste crate): nenhuma crate nova.
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Fase 22.8.8.2 (M2) — validação do formato da sessão. Já presentes no Cargo.lock (dependências do próprio Tauri):
# nenhuma crate nova.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Fase 22.8.8.2 (M2) — Windows Credential Manager (CredReadW/CredWriteW/CredDeleteW). Mesma versão que o Tauri já usa
# (0.61.2, no Cargo.lock); só habilita as features das APIs de credencial.
[target.'cfg(windows)'.dependencies]
# Fase 22.8.8.4 (M4) — + mutex nomeado de instância única (CreateMutexW) e aviso nativo (MessageBoxW).
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

# Fase 22.8.8.5 (M5) — runtime de testes do Tauri (`tauri::test`) para validar a ACL dos comandos de sessão. Feature
# sem dependências (`test = []` no próprio tauri) e só de desenvolvimento: o binário de produção não muda.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[features]
default = []
# Fase 22.8.8.7 (M7) — ambiente de DESENVOLVIMENTO isolado (identidade, credencial e mutex próprios). Nunca ativada
# por padrão nem pelo build oficial; não compila em perfil release (`ambiente.rs`) e exige a configuração isolada
# (`build.rs`). Uso: `bun run tauri:isolado`.
ambiente-isolado = []
