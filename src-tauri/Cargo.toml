[package]
name = "mariela-backoffice"
version = "0.1.0"
description = "MARIELA Backoffice desktop shell"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mariela_backoffice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
# Exigido diretamente (não só transitivamente) pela macro `tauri::generate_context!()`
# a partir do bump do core do Tauri trazido pelo plugin updater (2.11.5 -> 2.12.5).
serde_json = "1"

[features]
default = []

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
